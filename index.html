<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa de Oportunidades con IA</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f1a;
      --surface: #16162a;
      --card: #1e1e35;
      --card-hover: #252540;
      --border: #2e2e55;
      --accent: #7c3aed;
      --accent2: #06b6d4;
      --accent3: #10b981;
      --danger: #ef4444;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --gold: #f59e0b;
      --radius: 14px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1a1a3e 0%, #0f0f1a 100%);
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }

    .logo h1 {
      font-size: 1.3rem;
      font-weight: 700;
      background: linear-gradient(90deg, #a78bfa, #67e8f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .btn-publish {
      background: linear-gradient(135deg, var(--accent), #9333ea);
      color: white;
      border: none;
      padding: 0.65rem 1.5rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-publish:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(124,58,237,0.5); }

    /* ── Main Layout ── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* ── Stats bar ── */
    .stats {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.5rem;
      flex: 1;
      min-width: 140px;
      text-align: center;
    }

    .stat-card .number {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-card .label { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; }

    /* ── Filters ── */
    .filters {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex: 1;
      min-width: 150px;
    }

    .filter-group label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .filter-group select,
    .filter-group input {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 0.55rem 0.75rem;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .filter-group select:focus,
    .filter-group input:focus { border-color: var(--accent); }

    .btn-reset {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.55rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-reset:hover { border-color: var(--accent); color: var(--text); }

    /* ── Cards Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      transition: all 0.25s;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }
    .card:hover { background: var(--card-hover); transform: translateY(-3px); box-shadow: var(--shadow); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
      gap: 0.5rem;
    }

    .card-title { font-size: 1.05rem; font-weight: 700; line-height: 1.3; }

    .badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.3rem 0.7rem;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .badge-category { background: rgba(124,58,237,0.2); color: #a78bfa; border: 1px solid rgba(124,58,237,0.3); }
    .badge-alto { background: rgba(16,185,129,0.15); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
    .badge-medio { background: rgba(245,158,11,0.15); color: #fcd34d; border: 1px solid rgba(245,158,11,0.3); }
    .badge-bajo { background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }

    .card-location {
      font-size: 0.8rem;
      color: var(--accent2);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .section-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
    }

    .section-text {
      font-size: 0.88rem;
      color: var(--text);
      line-height: 1.5;
      margin-bottom: 0.9rem;
    }

    .ai-solution {
      background: rgba(6,182,212,0.08);
      border: 1px solid rgba(6,182,212,0.2);
      border-radius: 8px;
      padding: 0.75rem;
      margin-bottom: 1rem;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .card-date { font-size: 0.75rem; color: var(--text-muted); }

    .btn-like {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-like:hover { background: rgba(239,68,68,0.2); transform: scale(1.05); }
    .btn-like.liked { background: rgba(239,68,68,0.25); border-color: var(--danger); color: var(--danger); }

    /* ── Empty / Loading ── */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
    .empty-state h3 { font-size: 1.1rem; margin-bottom: 0.5rem; color: var(--text); }

    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

    .modal-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-full { grid-column: 1 / -1; }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 0.7rem 0.9rem;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
      resize: vertical;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,58,237,0.15); }

    .form-group textarea { min-height: 80px; }

    .modal-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
      margin-top: 1.5rem;
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.65rem 1.25rem;
      border-radius: 10px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-cancel:hover { border-color: var(--text-muted); color: var(--text); }

    .btn-submit {
      background: linear-gradient(135deg, var(--accent), #9333ea);
      color: white;
      border: none;
      padding: 0.65rem 1.5rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 130px;
    }
    .btn-submit:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(124,58,237,0.5); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.9rem;
      z-index: 999;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
      max-width: 360px;
      box-shadow: var(--shadow);
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: var(--accent3); }
    .toast.error { border-color: var(--danger); }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      main { padding: 1rem; }
      .form-grid { grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- ── Header ── -->
<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">🗺️</div>
      <div>
        <h1>Mapa de Oportunidades con IA</h1>
        <p>Detecta y comparte oportunidades de negocio en cualquier ciudad</p>
      </div>
    </div>
    <button class="btn-publish" onclick="openModal()">
      ✦ Publicar Oportunidad
    </button>
  </div>
</header>

<!-- ── Main ── -->
<main>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="number" id="stat-total">—</div>
      <div class="label">Oportunidades</div>
    </div>
    <div class="stat-card">
      <div class="number" id="stat-cities">—</div>
      <div class="label">Ciudades</div>
    </div>
    <div class="stat-card">
      <div class="number" id="stat-countries">—</div>
      <div class="label">Países</div>
    </div>
    <div class="stat-card">
      <div class="number" id="stat-likes">—</div>
      <div class="label">Likes totales</div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters">
    <div class="filter-group">
      <label>🌍 País</label>
      <select id="filter-country" onchange="applyFilters()">
        <option value="">Todos los países</option>
      </select>
    </div>
    <div class="filter-group">
      <label>🏙️ Ciudad</label>
      <select id="filter-city" onchange="applyFilters()">
        <option value="">Todas las ciudades</option>
      </select>
    </div>
    <div class="filter-group">
      <label>🏷️ Categoría</label>
      <select id="filter-category" onchange="applyFilters()">
        <option value="">Todas las categorías</option>
      </select>
    </div>
    <button class="btn-reset" onclick="resetFilters()">✕ Limpiar filtros</button>
  </div>

  <!-- Grid -->
  <div id="container">
    <div class="loading">
      <div class="spinner"></div>
      Conectando con Supabase...
    </div>
  </div>

</main>

<!-- ── Modal: Publicar ── -->
<div class="modal-overlay" id="modal" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-title">✦ Nueva Oportunidad</div>
    <form id="form" onsubmit="submitForm(event)">
      <div class="form-grid">
        <div class="form-group form-full">
          <label>Nombre de la oportunidad *</label>
          <input type="text" id="f-name" placeholder="Ej: Servicio de entrega con IA para restaurantes" required />
        </div>
        <div class="form-group">
          <label>Ciudad *</label>
          <input type="text" id="f-city" placeholder="Ej: Madrid" required />
        </div>
        <div class="form-group">
          <label>País *</label>
          <input type="text" id="f-country" placeholder="Ej: España" required />
        </div>
        <div class="form-group form-full">
          <label>Problema detectado *</label>
          <textarea id="f-problem" placeholder="¿Qué problema existe en esa ciudad?" required></textarea>
        </div>
        <div class="form-group form-full">
          <label>Solución con IA *</label>
          <textarea id="f-ai_solution" placeholder="¿Cómo puede la IA resolver este problema?" required></textarea>
        </div>
        <div class="form-group">
          <label>Categoría *</label>
          <select id="f-category" required>
            <option value="">Selecciona...</option>
            <option>Salud</option>
            <option>Educación</option>
            <option>Transporte</option>
            <option>Comercio</option>
            <option>Alimentación</option>
            <option>Turismo</option>
            <option>Finanzas</option>
            <option>Medioambiente</option>
            <option>Seguridad</option>
            <option>Inmobiliario</option>
            <option>Logística</option>
            <option>Otro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Potencial de negocio *</label>
          <select id="f-potential" required>
            <option value="">Selecciona...</option>
            <option value="Alto">🟢 Alto</option>
            <option value="Medio">🟡 Medio</option>
            <option value="Bajo">🔴 Bajo</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn-submit" id="btn-submit">Publicar ✦</button>
      </div>
    </form>
  </div>
</div>

<!-- ── Toast ── -->
<div class="toast" id="toast">
  <span id="toast-icon"></span>
  <span id="toast-msg"></span>
</div>

<script>
  // ─── Supabase Config ───────────────────────────────────────
  const SUPABASE_URL = 'https://qgvwpbiqivvpttqbpezl.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFndndwYmlxaXZ2cHR0cWJwZXpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4Nzg0NjIsImV4cCI6MjEwOTQ1NDQ2Mn0.NYHI5lloo7u27Sukevh6xlbEfGe_Orvy9yLS1Z5Kp4M';
  const HEADERS = {
    'apikey': SUPABASE_KEY,
    'Authorization': `Bearer ${SUPABASE_KEY}`,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
  };

  // ─── State ────────────────────────────────────────────────
  let allOpportunities = [];
  let likedIds = JSON.parse(localStorage.getItem('liked_ids') || '[]');

  // ─── API Helpers ──────────────────────────────────────────
  async function fetchOpportunities() {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/opportunities?select=*&order=created_at.desc`,
      { headers: HEADERS }
    );
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  async function insertOpportunity(data) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/opportunities`, {
      method: 'POST',
      headers: HEADERS,
      body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  async function updateLikes(id, likes) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/opportunities?id=eq.${id}`, {
      method: 'PATCH',
      headers: HEADERS,
      body: JSON.stringify({ likes })
    });
    if (!res.ok) throw new Error(await res.text());
    return res.json();
  }

  // ─── Load & Render ────────────────────────────────────────
  async function loadAndRender() {
    try {
      allOpportunities = await fetchOpportunities();
      updateStats(allOpportunities);
      populateFilters(allOpportunities);
      applyFilters();
    } catch (err) {
      console.error(err);
      document.getElementById('container').innerHTML = `
        <div class="empty-state">
          <div class="icon">⚠️</div>
          <h3>Error al conectar con Supabase</h3>
          <p>${err.message}</p>
        </div>`;
    }
  }

  function updateStats(opps) {
    document.getElementById('stat-total').textContent = opps.length;
    document.getElementById('stat-cities').textContent = new Set(opps.map(o => o.city)).size;
    document.getElementById('stat-countries').textContent = new Set(opps.map(o => o.country)).size;
    document.getElementById('stat-likes').textContent = opps.reduce((s, o) => s + (o.likes || 0), 0);
  }

  function populateFilters(opps) {
    const countryEl = document.getElementById('filter-country');
    const cityEl = document.getElementById('filter-city');
    const catEl = document.getElementById('filter-category');

    const selectedCountry = countryEl.value;
    const selectedCity = cityEl.value;
    const selectedCat = catEl.value;

    const countries = [...new Set(opps.map(o => o.country))].sort();
    const cities = [...new Set(opps.map(o => o.city))].sort();
    const categories = [...new Set(opps.map(o => o.category))].sort();

    countryEl.innerHTML = '<option value="">Todos los países</option>' +
      countries.map(c => `<option ${c === selectedCountry ? 'selected' : ''}>${c}</option>`).join('');
    cityEl.innerHTML = '<option value="">Todas las ciudades</option>' +
      cities.map(c => `<option ${c === selectedCity ? 'selected' : ''}>${c}</option>`).join('');
    catEl.innerHTML = '<option value="">Todas las categorías</option>' +
      categories.map(c => `<option ${c === selectedCat ? 'selected' : ''}>${c}</option>`).join('');
  }

  function applyFilters() {
    const country = document.getElementById('filter-country').value;
    const city = document.getElementById('filter-city').value;
    const category = document.getElementById('filter-category').value;

    let filtered = allOpportunities;
    if (country) filtered = filtered.filter(o => o.country === country);
    if (city) filtered = filtered.filter(o => o.city === city);
    if (category) filtered = filtered.filter(o => o.category === category);

    renderGrid(filtered);
  }

  function resetFilters() {
    document.getElementById('filter-country').value = '';
    document.getElementById('filter-city').value = '';
    document.getElementById('filter-category').value = '';
    applyFilters();
  }

  function renderGrid(opps) {
    const container = document.getElementById('container');
    if (opps.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="icon">🔍</div>
          <h3>No hay oportunidades aquí aún</h3>
          <p>¡Sé el primero en publicar una oportunidad!</p>
        </div>`;
      return;
    }

    container.innerHTML = `<div class="grid">${opps.map(renderCard).join('')}</div>`;
  }

  function renderCard(o) {
    const isLiked = likedIds.includes(o.id);
    const date = new Date(o.created_at).toLocaleDateString('es-ES', {
      day: '2-digit', month: 'short', year: 'numeric'
    });
    const potClass = o.potential === 'Alto' ? 'badge-alto' : o.potential === 'Medio' ? 'badge-medio' : 'badge-bajo';
    const potIcon = o.potential === 'Alto' ? '🟢' : o.potential === 'Medio' ? '🟡' : '🔴';

    return `
      <div class="card">
        <div class="card-header">
          <div class="card-title">${escHtml(o.name)}</div>
          <span class="badge badge-category">${escHtml(o.category)}</span>
        </div>
        <div class="card-location">
          📍 ${escHtml(o.city)}, ${escHtml(o.country)}
          &nbsp;·&nbsp;
          <span class="badge ${potClass}">${potIcon} ${escHtml(o.potential)}</span>
        </div>
        <div class="section-label">Problema</div>
        <div class="section-text">${escHtml(o.problem)}</div>
        <div class="ai-solution">
          <div class="section-label">💡 Solución con IA</div>
          <div class="section-text" style="margin-bottom:0">${escHtml(o.ai_solution)}</div>
        </div>
        <div class="card-footer">
          <span class="card-date">🗓 ${date}</span>
          <button class="btn-like ${isLiked ? 'liked' : ''}" onclick="toggleLike('${o.id}', ${o.likes}, ${isLiked})">
            ${isLiked ? '❤️' : '🤍'} ${o.likes}
          </button>
        </div>
      </div>`;
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  // ─── Like ─────────────────────────────────────────────────
  async function toggleLike(id, currentLikes, isLiked) {
    const newLikes = isLiked ? Math.max(0, currentLikes - 1) : currentLikes + 1;

    // Optimistic UI
    if (isLiked) {
      likedIds = likedIds.filter(x => x !== id);
    } else {
      likedIds.push(id);
    }
    localStorage.setItem('liked_ids', JSON.stringify(likedIds));

    const opp = allOpportunities.find(o => o.id === id);
    if (opp) opp.likes = newLikes;
    applyFilters();
    updateStats(allOpportunities);

    try {
      await updateLikes(id, newLikes);
    } catch (err) {
      showToast('Error al actualizar like', 'error');
      // Revert
      if (isLiked) likedIds.push(id); else likedIds = likedIds.filter(x => x !== id);
      localStorage.setItem('liked_ids', JSON.stringify(likedIds));
      if (opp) opp.likes = currentLikes;
      applyFilters();
    }
  }

  // ─── Form Submit ──────────────────────────────────────────
  async function submitForm(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.textContent = 'Publicando...';

    const data = {
      name:        document.getElementById('f-name').value.trim(),
      city:        document.getElementById('f-city').value.trim(),
      country:     document.getElementById('f-country').value.trim(),
      problem:     document.getElementById('f-problem').value.trim(),
      ai_solution: document.getElementById('f-ai_solution').value.trim(),
      category:    document.getElementById('f-category').value,
      potential:   document.getElementById('f-potential').value,
      likes:       0
    };

    try {
      await insertOpportunity(data);
      showToast('¡Oportunidad publicada! 🎉', 'success');
      closeModal();
      document.getElementById('form').reset();
      await loadAndRender();
    } catch (err) {
      console.error(err);
      showToast('Error al publicar: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Publicar ✦';
    }
  }

  // ─── Modal ────────────────────────────────────────────────
  function openModal() {
    document.getElementById('modal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    document.getElementById('modal').classList.remove('open');
    document.body.style.overflow = '';
  }
  function closeModalOutside(e) {
    if (e.target === document.getElementById('modal')) closeModal();
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ─── Toast ────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg, type = 'success') {
    const toast = document.getElementById('toast');
    document.getElementById('toast-icon').textContent = type === 'success' ? '✅' : '❌';
    document.getElementById('toast-msg').textContent = msg;
    toast.className = `toast ${type} show`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.className = 'toast', 3500);
  }

  // ─── Init ─────────────────────────────────────────────────
  loadAndRender();
</script>
</body>
</html>
